name: LiveDashboard
options:
  bundleIdPrefix: app.live-dashboard
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
targets:
  SwiftSoup:
    type: library.static
    platform: iOS
    sources:
      - path: Vendor/SwiftSoup
    settings:
      base:
        PRODUCT_NAME: SwiftSoup
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: minimal
  LiveIngestionCore:
    type: library.static
    platform: iOS
    sources:
      - path: Sources/LiveIngestionCore
    dependencies:
      - target: SwiftSoup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.live-dashboard.ingestion
        GENERATE_INFOPLIST_FILE: YES
  LiveDashboardKit:
    type: framework
    platform: iOS
    sources:
      - path: Sources/LiveDashboardKit
        excludes:
          - "**/* 2.swift"
    dependencies:
      - target: LiveIngestionCore
        link: true
      - target: SwiftSoup
        link: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.live-dashboard.kit
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  LiveDashboard:
    type: application
    platform: iOS
    sources:
      - path: LiveDashboard
    info:
      path: LiveDashboard/Info.plist
      properties:
        CFBundleDisplayName: Live Dashboard
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: app.live-dashboard.deep-link
            CFBundleURLSchemes:
              - live-dashboard
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations:
          - zh-Hans
          - zh-Hant
          - en
          - ja
    dependencies:
      - target: LiveDashboardKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.live-dashboard
        CODE_SIGN_ENTITLEMENTS: LiveDashboard/LiveDashboard.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
  LiveDashboardKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/LiveDashboardKitTests
    dependencies:
      - target: LiveDashboardKit
      - target: LiveIngestionCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.live-dashboard.tests
        CODE_SIGNING_ALLOWED: NO
  LiveDashboardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/LiveDashboardUITests
        excludes:
          - "**/* 2.swift"
    dependencies:
      - target: LiveDashboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.live-dashboard.ui-tests
        CODE_SIGNING_ALLOWED: NO
schemes:
  LiveDashboard:
    build:
      targets:
        LiveDashboard: all
        LiveDashboardKitTests: [test]
    test:
      targets:
        - LiveDashboardKitTests
        - LiveDashboardUITests
