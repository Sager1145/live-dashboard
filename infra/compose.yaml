name: live-dashboard
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: livedash
      POSTGRES_USER: livedash
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livedash"]
      interval: 5s
      retries: 10
  migrate:
    build: ../server
    command: ["node", "dist/src/cli.js", "migrate"]
    environment: &backend
      DATABASE_URL: postgresql://livedash:${POSTGRES_PASSWORD}@db:5432/livedash
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN}
      BLOB_ROOT: /var/lib/livedash/blobs
    depends_on:
      db: {condition: service_healthy}
  api:
    build: ../server
    command: ["node", "dist/src/main.js"]
    environment:
      <<: *backend
      HOST: 0.0.0.0
    ports: ["127.0.0.1:3000:3000"]
    volumes: ["blobs:/var/lib/livedash/blobs:ro"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
  scheduler:
    build: ../server
    command: ["node", "dist/src/cli.js", "scheduler"]
    environment: *backend
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
    read_only: true
    mem_limit: 256m
  fetch-worker:
    build: ../server
    volumes: ["blobs:/var/lib/livedash/blobs"]
    command: ["node", "dist/src/cli.js", "worker"]
    environment: *backend
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
    read_only: true
    mem_limit: 512m
  notification-worker:
    build: ../server
    command: ["node", "dist/src/cli.js", "notify"]
    environment:
      <<: *backend
      NOTIFICATIONS_ENABLED: "false"
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
    read_only: true
    mem_limit: 256m
volumes:
  blobs:
  postgres:
