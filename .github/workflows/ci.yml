name: Verify
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: livedash
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/livedash
      - run: npm run build
      - run: npm run migrate
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/livedash
  ios:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -project ios/LiveDashboard.xcodeproj -scheme LiveDashboard -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - run: xcodebuild -project ios/LiveDashboard.xcodeproj -scheme LiveDashboard -destination "platform=iOS Simulator,name=iPhone 17 Pro,OS=26.4.1" -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test
      - run: xcodebuild -project ios/LiveDashboard.xcodeproj -scheme LiveDashboard -destination "generic/platform=iOS" -configuration Release CODE_SIGNING_ALLOWED=NO build
